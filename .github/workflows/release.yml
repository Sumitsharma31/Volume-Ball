name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Volume Ball ${{ github.ref_name }} 🕹️"
          draft: false
          prerelease: false
          files: release/*.apk
          body: |
            # Volume Ball ${{ github.ref_name }} 🕹️🔊
            **The Modern Floating Game-Joystick Solution for Android Volume Control**

            ### 🚀 What's New in This Release:
            - ⏱️ **Drag Drop Actions**: Long-press and drag the joystick to reveal bottom action targets — **"Hide 1m"** (temporarily pauses joystick for 60 seconds) and **"Stop Ball"** (safely shuts down floating overlay).
            - 🎨 **Redesigned Compact Drop Targets**: Minimal circular badges (56dp) with gentle micro-scaling (1.06x) and glowing borders.
            - 💰 **Google AdMob Integration**: Adaptive anchored banner support and full-screen interstitial flow on launch.
            - 🔄 **Real-Time Button Sync**: Main UI automatically synchronizes state immediately whenever the joystick is stopped from screen overlay or notification.

            ### ✨ Key Features:
            - 🕹️ **Interactive Game Joystick**: Drag Up/Right to raise, Down/Left to lower, hold to smoothly glide volume.
            - 📞 **Dynamic In-Call Audio Routing**: Automatically detects cellular calls, WhatsApp, Telegram, Google Meet, Zoom, and switches to Call Volume (`STREAM_VOICE_CALL`).
            - 🛡️ **Accidental Touch Protection**: Taps and accidental brushes are ignored; only intentional joystick deflections adjust volume.
            - 📍 **Hold-to-Reposition**: Hold for ~350ms to drag and snap the ball anywhere on your screen.
            - 🎨 **4 Ball Styles**: Classic Joystick, Cyber Neon, Minimal Frosted Glass, Retro Arcade.
            - ❖ **4 Inside Icon Sets**: Minimalist Geometric, Classic Volume Speakers, Cyber Gamer, Music Waves.
            - ☕ **Buy Developer a Coffee**: Integrated direct UPI support (`ssumit20kr@ybl`).

            ### 📲 Installation:
            1. Download the APK attached below.
            2. Install the APK on your Android device (Android 6.0+).
            3. Grant the "Display over other apps" permission when prompted and enjoy!
